[project]
name = "rag-production"
version = "0.1.0"
description = "Lab belajar RAG: dari naif sampai produksi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Dokumen berisi contoh kode untuk dijelaskan, bukan kode yang dijalankan —
# formatter tidak boleh mengubah tampilannya.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
